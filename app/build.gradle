plugins {
    alias(libs.plugins.android.application)
}

android {
    // The JNI entry points in libcameraprobe.so are bound by name
    // (Java_com_drivehub_kamera_CameraProbe_*), so the namespace must stay put even though
    // this fork ships under its own applicationId.
    namespace 'com.drivehub.kamera'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.tommasov.mg4dashcam"
        minSdk 28
        targetSdk 36
        versionCode 15
        versionName "0.1.0-beta.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // No externalNativeBuild: the native library is vendored as a prebuilt in
    // src/main/jniLibs. See src/main/jniLibs/README.md for how to rebuild it from
    // src/main/cpp instead.
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
