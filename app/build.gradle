import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

// The probe write key lives in apikeys.properties (git-ignored). A missing key is not a build
// error: the send button is simply not offered, so a fresh clone still builds and still runs.
def apiKeysFile = rootProject.file("apikeys.properties")
def apiKeys = new Properties()
if (apiKeysFile.exists()) {
    apiKeysFile.withInputStream { apiKeys.load(it) }
}

android {
    // The JNI entry points in libcameraprobe.so are bound by name
    // (Java_com_drivehub_kamera_CameraProbe_*), so the namespace must stay put even though
    // this fork ships under its own applicationId.
    namespace 'com.drivehub.kamera'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.tommasov.mg4dashcam"
        minSdk 28
        targetSdk 36
        versionCode 19
        versionName "0.1.0-beta.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }

        buildConfigField "String", "PROBE_URL",
                "\"https://ws2.tommasovietina.it/mg4/probe.php\""
        // Which drawer a report lands in on the probe: one per app.
        buildConfigField "String", "PROBE_APP", "\"dashcam\""
        // Ships inside the APK, so anyone who unzips one can read it. That is why the probe
        // can only accept a report: it cannot read one back, list them or delete anything.
        buildConfigField "String", "PROBE_KEY",
                "\"" + apiKeys.getProperty("probe.key", "") + "\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // No externalNativeBuild: the native library is vendored as a prebuilt in
    // src/main/jniLibs. See src/main/jniLibs/README.md for how to rebuild it from
    // src/main/cpp instead.
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
